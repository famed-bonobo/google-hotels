name: Tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Every Monday the live tests check that Google still answers the way the parsers expect.
    - cron: '17 6 * * 1'
  workflow_dispatch:

jobs:
  offline:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e . pytest pytest-asyncio ruff mypy
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: mypy src
      - run: pytest

  live:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -e . pytest pytest-asyncio
      - run: pytest -m live -v
